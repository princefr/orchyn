[package]
name = "orchyn-harness"
version = "0.1.0"
edition = "2024"

[dependencies]
orchyn-core = { path = "../core" }
orchyn-model-client = { path = "../model-client" }
orchyn-artifact-storage = { path = "../artifact-storage" }
orchyn-runtime-tracer = { path = "../runtime-tracer" }
orchyn-pixel-observer = { path = "../pixel-observer" }
orchyn-actor-engine = { path = "../actor-engine" }
orchyn-platform-web = { path = "../platform-web" }
orchyn-action-executor = { path = "../action-executor" }
orchyn-storage = { path = "../storage" }
orchyn-codebase-indexer = { path = "../codebase-indexer" }
orchyn-fixer-agent = { path = "../fixer-agent" }
orchyn-toolkit = { path = "../toolkit" }

tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
# async-trait removed - using native async traits
bytes = { version = "1.0", features = ["serde"] }
chrono = { workspace = true }
uuid = { workspace = true }
path-clean = "1.0"

[dev-dependencies]
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
