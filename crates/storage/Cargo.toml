[package]
name = "orchyn-storage"
version.workspace = true
edition.workspace = true

[dependencies]
orchyn-core = { workspace = true }
orchyn-spec-engine = { path = "../spec-engine" }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
tokio = { workspace = true, features = ["full"] }
aws-sdk-s3 = "1.131.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
uuid.workspace = true
async-graphql = { version = "7.0", features = ["chrono", "uuid"] }
async-stripe = { version = "0.33", features = ["runtime-tokio-hyper", "webhook-events"] }
