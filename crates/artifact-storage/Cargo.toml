[package]
name = "orchyn-artifact-storage"
version = "0.1.0"
edition = "2024"
description = "Modular artifact storage for Orchyn (local filesystem and S3)"

[dependencies]
# async-trait removed - using native async traits
tokio = { workspace = true, features = ["fs", "io-util"] }
uuid = { workspace = true, features = ["v4", "serde"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
thiserror = { workspace = true }
bytes = "1.10"
chrono = { workspace = true, features = ["serde"] }

# S3 support (optional)
aws-sdk-s3 = { version = "1.46", optional = true }
aws-config = { version = "1.5", optional = true }
aws-types = { version = "1.3", optional = true }

[features]
default = ["local"]
local = []
s3 = ["aws-sdk-s3", "aws-config", "aws-types"]

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
