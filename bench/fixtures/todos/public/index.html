<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todos</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; background: #f6f7f9; color: #1d1f23; }
  .panel { max-width: 360px; background: #fff; border: 1px solid #d9dce1; border-radius: 10px; padding: 20px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; font-size: 15px; border: 1px solid #b8bec6; border-radius: 6px; }
  button { padding: 8px 14px; font-size: 15px; border: 0; border-radius: 6px; background: #2d5be3; color: #fff; cursor: pointer; }
  ul { padding-left: 20px; margin: 16px 0 0; }
  li { margin: 4px 0; }
</style>
</head>
<body>
<div class="panel">
  <h1>My todos</h1>
  <div class="row">
    <input id="title" type="text" placeholder="What needs doing?">
    <button id="add-btn" type="button">Add</button>
  </div>
  <ul id="list"></ul>
</div>
<script src="/app.js"></script>
</body>
</html>
