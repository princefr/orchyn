[package]
name = "orchyn-cli"
version.workspace = true
edition.workspace = true

[dependencies]
orchyn-core = { workspace = true }
orchyn-model-client = { workspace = true }
orchyn-harness = { workspace = true }
orchyn-artifact-storage = { workspace = true }
orchyn-pixel-observer = { workspace = true }
orchyn-storage = { path = "../../crates/storage" }
orchyn-action-executor = { workspace = true }
orchyn-platform-web = { workspace = true }
orchyn-toolkit = { workspace = true }
futures.workspace = true
serde.workspace = true
chrono = { workspace = true }
tokio = { workspace = true, features = ["full"] }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
clap = { version = "4.5", features = ["derive", "env"] }
tempfile = "3.10"
git2 = { workspace = true }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ratatui = "0.28"
crossterm = "0.28"
serde_json.workspace = true
colored = "3.1.1"
similar = { version = "2.4", features = ["inline"] }
